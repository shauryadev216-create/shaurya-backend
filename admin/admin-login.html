<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }

        .login-box {
            width: 360px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #111;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginBtn">
            Login
        </button>

        <div id="message"></div>

    </div>

    <script src="admin-login.js"></script>

</body>

</html>
